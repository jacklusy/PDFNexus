name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pdfnexus
          POSTGRES_PASSWORD: pdfnexus
          POSTGRES_DB: pdfnexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdfnexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://pdfnexus:pdfnexus@localhost:5432/pdfnexus?schema=public
      REDIS_URL: redis://localhost:6379
      COOKIE_SECRET: ci-test-cookie-secret-at-least-32-chars
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: pdfnexus
      S3_FORCE_PATH_STYLE: "true"
      MAIL_PROVIDER: smtp
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAIL_FROM: PDFNexus <noreply@localhost>

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared
        run: npm run build -w @pdfnexus/shared

      - name: Prisma generate
        run: npm run prisma:generate -w @pdfnexus/api

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build API
        run: npm run build -w @pdfnexus/api

      - name: Build Web
        run: npm run build -w @pdfnexus/web

      - name: Bundle budget
        run: npm run bundle-budget

      - name: Format check
        run: npm run format:check || true

      - name: Audit (non-blocking high+)
        run: npm audit --omit=dev --audit-level=high || true
